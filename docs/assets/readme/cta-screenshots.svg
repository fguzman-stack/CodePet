<svg xmlns="http://www.w3.org/2000/svg" width="260" height="58" viewBox="0 0 260 58" role="img" aria-labelledby="title desc">
  <title id="title">View screenshots</title>
  <desc id="desc">Violet terminal-style button to open the screenshot gallery.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#7C4DFF"/><stop offset="1" stop-color="#64B5F6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="256" height="54" rx="18" fill="#0D1117" stroke="url(#g)" stroke-width="2"/>
  <rect x="10" y="10" width="240" height="38" rx="13" fill="url(#g)" opacity=".16"/>
  <rect x="27" y="19" width="25" height="18" rx="4" fill="none" stroke="#F4F0FF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="45" cy="24" r="2.3" fill="#F4F0FF"/>
  <path d="m29 37 8-8 5 5 4-4 5 7" fill="none" stroke="#F4F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="67" y="27" fill="#F8F5FF" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700">view screenshots</text>
  <text x="67" y="42" fill="#C8B8FF" font-family="Consolas,Menlo,monospace" font-size="10">7 ordered captures</text>
</svg>
